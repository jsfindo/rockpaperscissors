<body>

  <script>
    function getComputerChoice(){
       return Math.floor(Math.random() *3)
    }
    
    // 0 scissors 1 rock 2 paper


    function getHumanChoice(){
        let choice = prompt("enter your choice")
        let final = choice.toLowerCase()
        return final
    }

  

    let HumanScore = 0
    let ComputerScore = 0

    function playround(){
        let compValue = getComputerChoice()
        let HumanValue = getHumanChoice()

        if (compValue == 0 && HumanValue == "rock"){
            HumanScore += 1
            let message = "You Win"
        } else if (compValue == 1 && HumanValue == "paper"){
            HumanScore += 1
            let message = "You Win"
        } else if (compValue == 2 && HumanValue == "scissors"){
            HumanScore +=1
            let message = "You Win"
        } else {
            ComputerScore += 1
            let message = "You lose"
        }

        return message 
        }
    
   function PlayGame(){
        playround()
        playround()
        playround()
        playround()
        playround()

        if (ComputerScore >= HumanScore){
            let finalMessage = "you lost"
        } else{
            let finalMessage = "you won"
        }
        return "your points: " + HumanScore + " computer points: "+ ComputerScore+ " "+ finalMessage

   }
        console.log(PlayGame())
    
  </script>
