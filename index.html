<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>

  <script>
    function getComputerChoice(){
       return Math.floor(Math.random() *3)
    }
    
    // 0 scissors 1 rock 2 paper


    function getHumanChoice(){
        let choice = prompt("enter your choice")
        let final = choice.toLowerCase()
        return final
    }

  

    let HumanScore = 0
    let ComputerScore = 0

    function playround(){
        let compValue = getComputerChoice()
        let HumanValue = getHumanChoice()

        if compValue == 0 && HumanValue == "rock"{
            HumanScore += 1
        } else if compValue == 1 && HumanValue == "paper"{
            HumanScore += 1
        } else if compValue == 2 && HumanValue == "scissors"{
            HumanScore +=1
        } else {
            ComputerScore += 1
        }

        return "You have " +HumanScore + "and computer has " + ComputerScore
        }
    
    console.log(playround())
        
    
  </script>

</body>
</html>
