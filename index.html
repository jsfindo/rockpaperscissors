<body>

  <script>
    function getComputerChoice(){
       return Math.floor(Math.random() *3)
    }
    
    // 0 scissors 1 rock 2 paper


    function getHumanChoice(){
        let choice = prompt("enter your choice")
        let final = choice.toLowerCase()
        return final
    }

  

    let HumanScore = 0
    let ComputerScore = 0
  message = " "
    function playround(){
        let compValue = getComputerChoice()
        let HumanValue = getHumanChoice()

        if (compValue == 0 && HumanValue == "rock"){
            HumanScore += 1
            message = " You Win "
        } else if (compValue == 1 && HumanValue == "paper"){
            HumanScore += 1
            message = " You Win "
        } else if (compValue == 2 && HumanValue == "scissors"){
            HumanScore +=1
            message = " You Win "
        } else {
            ComputerScore += 1 
            message = " You lose "
        }

        return message 
        
        }
    let finalMessage = " "
   function PlayGame(){
        game1 = playround()
        game2 = playround()
        game3 = playround()
        game4 = playround()
        game5 = playround()

        if (ComputerScore >= HumanScore){
            finalMessage = "you lost"
        } else{
            finalMessage = "you won"
        }

        return game1 + game2 + game3+ game4 +game5 + " your points: " + HumanScore + " computer points: "+ ComputerScore+ " "+ finalMessage

   }
        console.log(PlayGame())
    
  </script>
